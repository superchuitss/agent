<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Создание заявки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #222222);
      --hint: var(--tg-theme-hint-color, #888888);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    body { 
      margin: 0; 
      padding: 16px; 
      background: var(--bg); 
      color: var(--text); 
      padding-bottom: 90px; 
    }
    h2 { 
      font-size: 18px; 
      margin: 0 0 12px; 
    }
    .card { 
      background: var(--secondary-bg); 
      border-radius: 12px; 
      padding: 12px; 
      margin-bottom: 16px; 
    }
    label { 
      display: block; 
      font-size: 13px; 
      color: var(--hint); 
      margin-bottom: 6px; 
    }
    select, input[type="text"], textarea {
      width: 100%; 
      padding: 10px 12px; 
      border-radius: 8px; 
      border: 1px solid rgba(128,128,128,0.25);
      background: var(--bg); 
      color: var(--text); 
      font-size: 15px; 
      outline: none;
    }
    select option { 
      background: var(--bg); 
      color: var(--text); 
    }
    .product-item {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 10px 0; 
      border-bottom: 1px solid rgba(128,128,128,0.15);
    }
    .product-item:last-child { 
      border-bottom: none; 
    }
    .product-info { 
      flex: 1; 
      padding-right: 10px; 
    }
    .product-name { 
      font-weight: 500; 
      font-size: 15px; 
    }
    .product-meta { 
      font-size: 13px; 
      color: var(--hint); 
      margin-top: 2px; 
    }
    .counter { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .counter button {
      width: 32px; 
      height: 32px; 
      border-radius: 8px; 
      border: none;
      background: var(--btn); 
      color: var(--btn-text); 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Оформление заявки</h2>
  <div class="card">
    <label for="client">Клиент / Компания</label>
    <input type="text" id="client" placeholder="Введите название..." />
  </div>
</body>
</html>
